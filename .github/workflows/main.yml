# Runs the Playwright tests on GitHub whenever test files are pushed

name: Playwright Tests

on:
  push:
    branches: [main]
    paths:
      - "tests/**"               # generated test files (.spec.ts / .spec.js)
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/main.yml"
  workflow_dispatch:             # also allows running it manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: always()             # upload the report even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
